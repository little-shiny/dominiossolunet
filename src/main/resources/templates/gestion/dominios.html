<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Gestión de dominios</title>
</head>
<body>

<h1>Gestión de dominios</h1>

<table>
    <thead>
    <tr>
        <th>ID</th>
        <th>Dominio</th>
        <th>Cliente</th>
        <th>Estado renovación</th>
        <th>Fecha expiración</th>
        <th>Acción</th>
    </tr>
    </thead>

    <tbody>

    <tr th:each="dominio : ${dominios}">

        <td th:text="${dominio.id}"></td>

        <td th:text="${dominio.nombreDominio}"></td>

        <td th:text="${dominio.cliente.nombre}"></td>

        <td th:text="${dominio.estadoRenovacion}"></td>

        <td th:text="${dominio.fechaExpiracion}"></td>

        <td>

            <form
                    th:if="${dominio.estadoRenovacion != T(com.dominiossolunet.model.enums.EstadoRenovacion).RENOVADO}"
                    th:action="@{/gestion/dominios/{id}/renovar(id=${dominio.id})}"
                    method="post">

                <button type="submit">
                    Marcar como renovado
                </button>

            </form>

            <span
                    th:if="${dominio.estadoRenovacion == T(com.dominiossolunet.model.enums.EstadoRenovacion).RENOVADO)">
                Renovado
            </span>

        </td>

    </tr>

    </tbody>
</table>

</body>
</html>
