<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">

<head>
    <meta charset="UTF-8">
    <title>Clientes</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f5f6fa;
        }

        header {
            background: #222;
            color: white;
            padding: 20px 30px;
        }

        nav a {
            color: white;
            margin-right: 20px;
            text-decoration: none;
        }

        main {
            padding: 30px;
        }

        h1 {
            margin-bottom: 25px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
        }

        th,
        td {
            padding: 14px;
            border-bottom: 1px solid #ddd;
            text-align: left;
        }

        th {
            background: #f0f0f0;
        }

        tr:hover {
            background: #fafafa;
        }

        .button {
            display: inline-block;
            padding: 7px 12px;
            background: #222;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }
    </style>
</head>

<body>

<header>

    <h2>Gestión de dominios</h2>

    <nav>
        <a th:href="@{/gestion/dashboard}">
            Dashboard
        </a>

        <a th:href="@{/gestion/dominios}">
            Dominios
        </a>

        <a th:href="@{/gestion/clientes}">
            Clientes
        </a>
    </nav>

</header>

<main>

    <h1>Clientes</h1>

    <table>

        <thead>
        <tr>
            <th>ID</th>
            <th>Cliente</th>
            <th>Email</th>
            <th>Dominios</th>
            <th>Acciones</th>
        </tr>
        </thead>

        <tbody>

        <tr th:each="cliente : ${clientes}">

            <td th:text="${cliente.id}">
                1
            </td>

            <td th:text="${cliente.nombre}">
                Cliente ejemplo
            </td>

            <td th:text="${cliente.email}">
                cliente@example.com
            </td>

            <td th:text="${cliente.dominios != null ? cliente.dominios.size() : 0}">
                0
            </td>

            <td>

                <a class="button"
                   th:href="@{/gestion/clientes/{id}(id=${cliente.id})}">
                    Ver cliente
                </a>

            </td>

        </tr>

        <tr th:if="${#lists.isEmpty(clientes)}">

            <td colspan="5">
                No hay clientes registrados.
            </td>

        </tr>

        </tbody>

    </table>

</main>

</body>

</html>
